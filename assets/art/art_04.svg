<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg04" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="70%" stop-color="#0E2333"/>
      <stop offset="100%" stop-color="#1A3B4F"/>
    </linearGradient>
    <linearGradient id="visorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="40%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="glow04">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg04)"/>

  <!-- Cockpit HUD Grid & Crosshairs -->
  <g stroke="#00E5FF" stroke-width="1" opacity="0.4">
    <circle cx="400" cy="450" r="280" fill="none" stroke-dasharray="16 16"/>
    <circle cx="400" cy="450" r="180" fill="none"/>
    <line x1="80" y1="450" x2="720" y2="450"/>
    <line x1="400" y1="120" x2="400" y2="780"/>
    <!-- Pitch ladder telemetry -->
    <line x1="340" y1="360" x2="460" y2="360" stroke-width="2"/>
    <line x1="360" y1="320" x2="440" y2="320"/>
    <line x1="340" y1="540" x2="460" y2="540" stroke-width="2"/>
    <line x1="360" y1="580" x2="440" y2="580"/>
    <text x="120" y="220" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00E5FF" letter-spacing="3">ALT: 42,000M // MACH 4.2</text>
    <text x="560" y="220" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FF9800" letter-spacing="3">LOCK // TARGET_0</text>
  </g>

  <!-- Flight Suit Shoulders & Life Support Harness -->
  <path d="M 140,1000 C 140,800 240,740 320,720 L 400,750 L 480,720 C 560,740 660,800 660,1000 Z" fill="#101820" stroke="#00E5FF" stroke-width="2"/>
  <path d="M 280,730 L 340,1000" stroke="#FF6B00" stroke-width="12" stroke-linecap="round"/>
  <path d="M 520,730 L 460,1000" stroke="#FF6B00" stroke-width="12" stroke-linecap="round"/>

  <!-- Mecha Flight Helmet (Angular Stealth Facets) -->
  <path d="M 280,480 L 320,320 L 400,260 L 480,320 L 520,480 L 480,620 L 400,680 L 320,620 Z" fill="#16222F" stroke="#00E5FF" stroke-width="3"/>
  
  <!-- Glowing Hexagonal Ear Comms -->
  <polygon points="260,460 280,430 300,460 300,500 280,530 260,500" fill="#FF6B00" filter="url(#glow04)"/>
  <polygon points="540,460 520,430 500,460 500,500 520,530 540,500" fill="#FF6B00" filter="url(#glow04)"/>

  <!-- Wide Panoramic Flight Visor (Gold Mirror Finish) -->
  <path d="M 310,400 L 490,400 L 470,520 L 400,550 L 330,520 Z" fill="url(#visorGold)" filter="url(#glow04)"/>
  <!-- Reflection Sheen across Visor -->
  <path d="M 320,410 L 420,410 L 360,520 L 335,510 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Chin Rebreather Module -->
  <rect x="365" y="580" width="70" height="40" rx="6" fill="#0A0E13" stroke="#FF6B00" stroke-width="2"/>
  <circle cx="385" cy="600" r="6" fill="#00E5FF"/>
  <circle cx="415" cy="600" r="6" fill="#00E5FF"/>

  <!-- Tag -->
  <g transform="translate(60, 910)">
    <rect x="0" y="0" width="260" height="34" rx="4" fill="#000000" opacity="0.8"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00E5FF" letter-spacing="2">04 // MECHA PILOT ZERO</text>
  </g>
</svg>