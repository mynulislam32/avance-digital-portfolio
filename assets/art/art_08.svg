<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg08" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040608"/>
      <stop offset="60%" stop-color="#0A1118"/>
      <stop offset="100%" stop-color="#061C24"/>
    </linearGradient>
    <linearGradient id="voidCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow08">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg08)"/>

  <!-- Spectral Mist / Atmospheric Particles -->
  <g opacity="0.3" fill="#38BDF8">
    <circle cx="160" cy="300" r="3"/>
    <circle cx="240" cy="220" r="4"/>
    <circle cx="340" cy="180" r="2.5"/>
    <circle cx="480" cy="160" r="3.5"/>
    <circle cx="620" cy="240" r="2"/>
    <circle cx="680" cy="320" r="4"/>
  </g>

  <!-- Heavy Tattered Draped Cloak Silhouette -->
  <path d="M 120,1000 C 120,780 200,660 300,600 L 400,640 L 500,600 C 600,660 680,780 680,1000 Z" fill="#080C10"/>
  <!-- Cloak folds & tattered hems -->
  <path d="M 300,600 L 260,1000 M 500,600 L 540,1000 M 400,640 L 400,1000" stroke="#05070A" stroke-width="6"/>

  <!-- Deep Shadowed Hood -->
  <path d="M 280,560 C 280,400 300,280 400,270 C 500,280 520,400 520,560 L 560,620 L 240,620 Z" fill="#0D131A" stroke="#16222F" stroke-width="2"/>
  
  <!-- Impenetrable Pitch-Black Interior of Hood -->
  <path d="M 310,540 C 310,420 330,340 400,330 C 470,340 490,420 490,540 C 490,570 450,590 400,590 C 350,590 310,570 310,540 Z" fill="#020305"/>

  <!-- Two Piercing Spectral Blue Soul Eyes -->
  <g filter="url(#glow08)">
    <ellipse cx="370" cy="450" rx="8" ry="4" fill="#38BDF8"/>
    <ellipse cx="430" cy="450" rx="8" ry="4" fill="#38BDF8"/>
    <circle cx="370" cy="450" r="3" fill="#FFFFFF"/>
    <circle cx="430" cy="450" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Floating Fractured Ancient Runic Artifact (Center Chest) -->
  <g transform="translate(400, 720)" filter="url(#glow08)">
    <!-- Fractured core shards -->
    <polygon points="0,-45 28,-15 15,20 -20,15" fill="#38BDF8" opacity="0.9"/>
    <polygon points="-30,-10 -10,35 -35,25" fill="#0284C7" opacity="0.8"/>
    <polygon points="10,-55 35,-30 20,-10" fill="#BAE6FD" opacity="0.85"/>
    <!-- Orbiting Runic Sigils -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 16"/>
  </g>

  <!-- Tag -->
  <g transform="translate(60, 910)">
    <rect x="0" y="0" width="260" height="34" rx="4" fill="#000000" opacity="0.8"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38BDF8" letter-spacing="2">08 // VOID WALKER</text>
  </g>
</svg>