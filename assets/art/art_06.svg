<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg06" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05080E"/>
      <stop offset="60%" stop-color="#091815"/>
      <stop offset="100%" stop-color="#04261C"/>
    </linearGradient>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg06)"/>

  <!-- Tokyo Rooftop Edge & Perspective Grid -->
  <polygon points="0,750 800,680 800,1000 0,1000" fill="#080C10"/>
  <line x1="0" y1="750" x2="800" y2="680" stroke="#00FF88" stroke-width="3" filter="url(#glowGreen)"/>

  <!-- Neon Japanese Kanji Signage in Background -->
  <g opacity="0.3" font-family="monospace" font-size="44" font-weight="bold" fill="#00FF88">
    <text x="650" y="220">忍</text>
    <text x="650" y="280">者</text>
    <text x="650" y="340">影</text>
  </g>

  <!-- Masked Shinobi Character Silhouette in Mid-Action Crouch -->
  <!-- Tactical Cape & Hood -->
  <path d="M 220,1000 L 260,780 L 320,620 L 400,560 L 480,620 L 540,780 L 580,1000 Z" fill="#0C1117"/>
  <!-- Armored Hood Silhouette -->
  <path d="M 330,520 C 330,420 340,350 400,340 C 460,350 470,420 470,520 L 490,560 L 310,560 Z" fill="#141C24"/>

  <!-- Glowing Cyber Oni Half-Mask -->
  <path d="M 345,460 L 400,540 L 455,460 L 440,430 L 360,430 Z" fill="#0A0E13" stroke="#00FF88" stroke-width="2.5" filter="url(#glowGreen)"/>
  <!-- Sharp Oni Fangs Graphic on Mask -->
  <polygon points="380,480 390,505 385,480" fill="#00FF88"/>
  <polygon points="420,480 410,505 415,480" fill="#00FF88"/>

  <!-- Intense Glowing Green Eyes from Shadow -->
  <g filter="url(#glowGreen)">
    <polygon points="360,420 385,425 365,432" fill="#00FF88"/>
    <polygon points="440,420 415,425 435,432" fill="#00FF88"/>
  </g>

  <!-- Dual Energy Kunai Daggers in Hands -->
  <g filter="url(#glowGreen)">
    <!-- Left Kunai -->
    <path d="M 200,600 L 260,720 L 250,730 L 190,610 Z" fill="#00FF88"/>
    <circle cx="185" cy="600" r="8" fill="none" stroke="#00FF88" stroke-width="2"/>
    <!-- Right Kunai -->
    <path d="M 600,600 L 540,720 L 550,730 L 610,610 Z" fill="#00FF88"/>
    <circle cx="615" cy="600" r="8" fill="none" stroke="#00FF88" stroke-width="2"/>
  </g>

  <!-- Tag -->
  <g transform="translate(60, 910)">
    <rect x="0" y="0" width="260" height="34" rx="4" fill="#000000" opacity="0.8"/>
    <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#00FF88" letter-spacing="2">06 // NEON STREET SHINOBI</text>
  </g>
</svg>